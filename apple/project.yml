name: Rook
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  RookKit:
    path: RookKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  Rook:
    type: application
    platform: iOS
    sources: [Rook]
    dependencies:
      - package: RookKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rook.prototype
        PRODUCT_NAME: Rook
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rook
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": "$(PROJECT_DIR)/../target/apple-ffi/ios-device"
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": "$(PROJECT_DIR)/../target/apple-ffi/ios-simulator"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        OTHER_LDFLAGS: ["-lrook_ffi", "-framework", "Security"]
  RookUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RookUITests]
    dependencies:
      - target: Rook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rook.prototype.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Rook:
    build:
      targets:
        Rook: all
    test:
      targets: [RookUITests]
