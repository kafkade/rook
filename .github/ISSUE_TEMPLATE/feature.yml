name: Feature request
description: Explain a training task and an incremental improvement.
labels: [enhancement, triage]
body:
  - type: textarea
    id: task
    attributes:
      label: User task
      description: What are you trying to accomplish, and what is missing today?
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed change and alternatives
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Offline, privacy, and recovery implications
      description: Keep future integrations optional and avoid assumptions about current capabilities.
