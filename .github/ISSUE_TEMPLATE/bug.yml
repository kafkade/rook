name: Bug report
description: Report reproducible behavior using synthetic or redacted examples.
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Do not include personal workout records, backups, keys, or passphrases.
        Do not report vulnerability details publicly; follow SECURITY.md.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: iPhone/simulator, iOS version, app revision, and relevant build tools.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Optional screenshots or logs without records, keys, or passphrases.
