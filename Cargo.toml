[workspace]
resolver = "2"
members = ["crates/rook-core", "crates/rook-db", "crates/rook-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
publish = false

[workspace.dependencies]
rook-core = { path = "crates/rook-core" }
rook-db = { path = "crates/rook-db" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
zeroize = "1"
age = "0.12.1"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
uniffi = "0.32.2"
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "thin"
